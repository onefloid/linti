name: Docs Pages

on:
  pull_request:
    paths:
      - 'site/**'
      - 'src/linti/**'
      - 'scripts/export_rule_reference.py'
      - '.github/workflows/docs-pages.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build LinTi wheel and export rules
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python scripts/export_rule_reference.py --check
          python -m pip wheel --no-deps --wheel-dir site/public/wheels .
      - name: Prepare self-hosted browser assets
        working-directory: site
        run: |
          npm ci
          node scripts/write-wheel-manifest.mjs
          node scripts/prepare-assets.mjs
          node scripts/smoke-pyodide.mjs
      - name: Generate Docus site
        working-directory: site
        run: npm run generate
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
